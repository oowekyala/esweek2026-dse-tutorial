# The environment for working on the tutorial: Jupyter, the notebooks'
# dependencies, and the dse package installed editable so edits under dse/
# are live in a running kernel after a restart.
#
# cinm-opt is not part of it. The notebooks find it through CINM_OPT, PATH, or
# a Cinnamon checkout beside this repository (see dse/paths.py); the tutorial
# image bundles it. In an editor, pick .pixi/envs/default/bin/python as the
# notebook kernel.
[workspace]
name = "dse-tutorial"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64"]

[dependencies]
# What the Cinnamon environment ships; the image runs the notebooks on that.
python = "3.12.*"
# The slides
texlive-core = "*"

[pypi-dependencies]
dse = { path = ".", editable = true }
notebook = "*"
# Stripping outputs before committing a notebook
nbformat = "*"

[tasks]
notebook = "jupyter notebook --notebook-dir=notebooks"
# The notebooks are generated from notebooks/_generate.py
generate = "python notebooks/_generate.py"
# The slides' figures, from the oracles and sweeps under data/
figures = "python slides/figures/_make.py"
slides = { cmd = "latexmk -pdf -interaction=nonstopmode -halt-on-error dse-tutorial.tex", cwd = "slides", depends-on = ["figures"] }
# Executes the three notebooks in order on one core, as a Binder session would
check = { cmd = "bash scripts/check-notebooks.sh" }
