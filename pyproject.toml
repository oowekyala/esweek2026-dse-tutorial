[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dse"
version = "0.1.0"
description = "Support code for the DSE tutorial notebooks: running cinm-opt, reading its dumps, plots, the configuration picker"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "ipython",
    "ipywidgets>=8",
    "pygments",
]

[tool.hatch.build.targets.wheel]
packages = ["dse"]
